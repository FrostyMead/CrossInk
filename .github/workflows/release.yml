name: Build FrostInk Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "FrostInk version, for example 1.5.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Record the tested source branch
        shell: bash
        run: |
          echo "Building a draft FrostInk release from $GITHUB_REF_NAME at $GITHUB_SHA"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Resolve release version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION="$VERSION_INPUT"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Version must contain three or four numeric segments (for example 1.5.1)" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install clang-format 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Check formatting
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code

      - name: Run host tests
        run: |
          cmake -S test -B build/test -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test
          ctest --test-dir build/test --output-on-failure -j

      - name: Build FrostInk for X3/X4
        env:
          CROSSINK_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: pio run -e default

      - name: Smoke test Frost theme
        run: python3 scripts/run_simulator_smoke_test.py --env simulator --theme frost

      - name: Write checksum
        shell: bash
        run: |
          cd .pio/build/default
          sha256sum "firmware-x3-x4-v${RELEASE_VERSION}.bin" > SHA256SUMS

      - name: Create hardware-test draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: FrostInk v${{ env.RELEASE_VERSION }}
          body: |
            FrostInk X3/X4 firmware.

            This release starts as a draft and must be tested on an X4 over USB before publishing.
          draft: true
          files: |
            .pio/build/default/firmware-x3-x4-v${{ env.RELEASE_VERSION }}.bin
            .pio/build/default/SHA256SUMS
